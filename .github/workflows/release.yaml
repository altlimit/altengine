# Release the altengine CLI (local emulator) as raw per-platform binaries, the same
# way altlimit/sitegen releases — installable with `alt install altlimit/altengine`.
# Auto-versions on every push to main that touches cli/**.
name: Release CLI

on:
  push:
    branches:
      - "main"
    paths:
      - "cli/**"
      - ".github/workflows/release.yaml"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum

      - name: Run tests
        working-directory: cli
        run: go test ./...

      - name: Set version
        id: version
        run: echo "VERSION=0.2.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build all platforms
        working-directory: cli
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          LDFLAGS="-s -w -X main.version=v${VERSION}"
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/altengine_linux_amd64 ./cmd/altengine
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/altengine_linux_arm64 ./cmd/altengine
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/altengine_darwin_amd64 ./cmd/altengine
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/altengine_darwin_arm64 ./cmd/altengine
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/altengine_windows_amd64.exe ./cmd/altengine

      - name: Generate checksums
        working-directory: cli/dist
        run: sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            cli/dist/altengine_linux_amd64
            cli/dist/altengine_linux_arm64
            cli/dist/altengine_darwin_amd64
            cli/dist/altengine_darwin_arm64
            cli/dist/altengine_windows_amd64.exe
            cli/dist/checksums.txt
