# CI for pull requests and non-release pushes: Go emulator tests + JS SDK unit and
# conformance tests (the conformance suite spawns the locally-built emulator).
name: CI

on:
  pull_request:
  push:
    branches:
      - "main"
    paths:
      - "js/**"
      - "conformance/**"
      - ".github/workflows/ci.yaml"

jobs:
  cli:
    name: CLI (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum
      - name: Vet
        working-directory: cli
        run: go vet ./...
      - name: Test
        working-directory: cli
        run: go test ./...

  js:
    name: JS SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install
        working-directory: js
        run: npm ci
      - name: Build
        working-directory: js
        run: npm run build
      - name: Unit + conformance tests
        working-directory: js
        run: npm test
