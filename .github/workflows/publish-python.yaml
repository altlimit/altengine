# Publish the altengine package to PyPI when a python/vX.Y.Z tag is pushed. The
# tag must match pyproject.toml's version. Uses PyPI trusted publishing (OIDC) —
# configure this repo/workflow as a trusted publisher for `altengine` on pypi.org.
name: Publish Python SDK

on:
  push:
    tags:
      - "python/v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: PyPI publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assert tag matches pyproject version
        working-directory: python
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#python/v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag python/v$TAG_VERSION != pyproject $PKG_VERSION" >&2
            exit 1
          fi

      - name: Test
        working-directory: python
        run: |
          pip install -e ".[ws]" pytest build
          pytest -q

      - name: Build sdist + wheel
        working-directory: python
        run: python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
